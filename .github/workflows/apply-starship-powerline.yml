name: Verify Starship powerline update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-starship-powerline.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run full test suite
        run: pytest -q

      - name: Validate AppImage layout
        run: packaging/build-appimage.sh --appdir-only --output "$RUNNER_TEMP/theme-package"
