name: Add Starship venv indicator

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-venv-to-starship.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add virtualenv name to Python prompt segments
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bin/theme_starship.py')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '("python", _G["python"], "$version", "accent2"),':
                  '("python", _G["python"], "$version( venv:$virtualenv)", "accent2"),',
              '("python", "", "$version"),':
                  '("python", "", "$version( venv:$virtualenv)"),',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected snippet not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          tests = Path('tests/test_starship_styles.py')
          t = tests.read_text(encoding='utf-8')
          if 'test_python_segments_show_active_virtualenv_name' not in t:
              t += '''\n\ndef test_python_segments_show_active_virtualenv_name():\n    for style in starship.STYLE_NAMES:\n        parsed = tomllib.loads(render(style))\n        assert "$virtualenv" in parsed["python"]["format"]\n        assert "venv:" in parsed["python"]["format"]\n'''
              tests.write_text(t, encoding='utf-8')
          PY

      - name: Validate
        run: |
          python -m py_compile bin/theme_starship.py
          python -m pip install -r requirements-dev.txt
          pytest -q tests/test_starship_styles.py

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/theme_starship.py tests/test_starship_styles.py
          git commit -m "feat: show active Python virtualenv in Starship prompts"
          git push origin HEAD:main
