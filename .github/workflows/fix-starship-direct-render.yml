name: Fix Starship direct render

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'chore: simplify Starship direct-render workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/apply-starship-direct-render-fix.py
      - name: Validate
        run: |
          python -m py_compile bin/theme-studio bin/theme_starship.py
          python -m pip install -r requirements-dev.txt
          pytest -q tests/test_starship_styles.py tests/test_theme_starship_cli.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/theme-studio tests/test_theme_starship_cli.py
          git commit -m "fix: render Starship layouts directly from Theme Studio"
          git push origin HEAD:main
