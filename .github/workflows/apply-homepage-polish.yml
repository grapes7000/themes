name: Apply homepage visual polish

on:
  push:
    branches:
      - feature/homepage-visual-polish
    paths:
      - .github/workflows/apply-homepage-polish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/homepage-visual-polish
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct and apply verified patch
        run: |
          cat .github/homepage-polish/patch.part* | base64 --decode | gzip --decompress > /tmp/homepage-visual-polish.patch
          git apply --check /tmp/homepage-visual-polish.patch
          git apply /tmp/homepage-visual-polish.patch

      - name: Verify implementation
        run: |
          python -m pip install --quiet pytest
          python -m py_compile bin/theme_homepage.py tests/test_homepage.py
          python -m pytest -q

      - name: Commit polished homepage
        run: |
          rm -rf .github/homepage-polish
          rm -f .github/workflows/apply-homepage-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish homepage visuals and media controls"
          git push origin HEAD:feature/homepage-visual-polish
